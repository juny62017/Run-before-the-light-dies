<!doctype html>
<html large="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A candle, a graveyard, and a gate somewhere in the dark. Run before the light dies">
    <title>RUN BEFORE THE LIGHT DIES</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/intro.css">


</head>
<body>
    <main class="home" id="home-screen">
        <div class="home-menu">
            <h1>
                <span>RUN BEFORE</span>
                <span>THE LIGHT DIES</span>
            </h1>

            <p class="tagline"> The dead Don't like the LIGHT.</p>
            <nav class="menu-buttons">
                <button class="board" id="play-button" type="button">PLAY</button>
                <button class="board" id="rules-button" type="button">RULES</button>
                <button class="board" id="about-button" type="button">ABOUT</button>
            </nav>
        </div>
    </main>

    <main class="game-scene" id="game-screen" hidden>
        <div class="game-hud">
            <button class="board" id="home-button" type="button"></button>HOME</button>
        </div>
    </main>

    <section class="intro-screen" id="intro-screen" hidden>
        <p class="intro-text" id="intro-text" tabindex="-1"></p>
    </section>

    <dialog class="overlay" id="info-overlay">
        <section class="notice">
            <h2 id="panel-title">THE RULES</h2>
            <div id="panel-content"></div>
            <button class="board back-button" id="back-button" type="button">BACK</button>
        </section>
    </dialog>


    <script src="js/main.js" defer></script>
</body>
</html>
