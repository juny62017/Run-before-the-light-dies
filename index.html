<!doctype html>
<html large="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A candle, a graveyard, and a gate somewhere in the dark. Run before the light dies">
    <title>RUN BEFORE THE LIGHT DIES</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/intro.css">


</head>
<body>
    <main class="home" id="home-screen">
        <div class="home-menu">
            <h1>
                <span>RUN BEFORE</span>
                <span>THE LIGHT DIES</span>
            </h1>

            <p class="tagline"> The dead Don't like the LIGHT.</p>
            <nav class="menu-buttons">
                <button class="board" id="play-button" type="button">PLAY</button>
                <button class="board" id="rules-button" type="button">RULES</button>
                <button class="board" id="about-button" type="button">ABOUT</button>
            </nav>
        </div>
    </main>

    <main class="game-scene" id="game-screen" hidden>
        <div class="game-hud">
            <div class="light-hud">
                <img src="assets/light-icon.png" alt"" width="20" height="30">
                <span>LIGHT:</span>
                <span>100%</span>
            </div>

            <button class="game-home" id="home-button" type="button">HOME</button>
        </div>

        <div class="game-world" id="game-world">
            <div class="platforms" id="starting-platforms">
                      <img class="stone-platform platform-one" src="assets/stone-platform.png" alt="" draggable="false">
      <img class="stone-platform platform-two" src="assets/stone-platform.png" alt="" draggable="false">
      <img class="stone-platform platform-three" src="assets/stone-platform.png" alt="" draggable="false">
      <img class="stone-platform platform-four" src="assets/stone-platform.png" alt="" draggable="false">
      <img class="stone-platform platform-five" src="assets/stone-platform.png" alt="" draggable="false">
      </div>

      <div class="player-start">
        <img class="batman" src="assets/batman.png" alt="Batman standing with a candle" draggable="false">
        <img class="player-candle" src="assets/light-icon.png" alt"" draggable="false">
      </div>
      <div class="ground"></div>
      </div>
    </main>

    <section class="intro-screen" id="intro-screen" hidden>
        <p class="intro-text" id="intro-text" tabindex="-1"></p>
    </section>

    <dialog class="overlay" id="info-overlay">
        <section class="notice">
            <h2 id="panel-title">THE RULES</h2>
            <div id="panel-content"></div>
            <button class="board back-button" id="back-button" type="button">BACK</button>
        </section>
    </dialog>


    <script src="js/main.js" defer></script>
</body>
</html>
